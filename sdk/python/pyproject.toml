[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tack-plugin"
version = "3.0.0"
description = "SDK for tack-RPC v3 plugins — build a plugin without ever seeing an envelope"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["tack_plugin*"]

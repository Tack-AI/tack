[package]
name = "tack-ext-wasm"
description = "Tack extension host: sandboxed WASM (wasmtime / WASI p1) carrier for the tack-ext NDJSON plugin protocol"
version.workspace = true
edition.workspace = true
# wasmtime 49 declares rust-version 1.96 — that is this crate's real floor.
rust-version = "1.96"
license.workspace = true
repository.workspace = true

[dependencies]
tack-ext.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
# Trimmed feature set: tack-ext-wasm runs WASI p1 core modules with fuel and
# epoch interruption only. Dropped from wasmtime defaults: the gc/*
# proposals, threads, stack-switching, pooling-allocator, coredump,
# profiling, debug/debug-builtins, wit-parser and compile-time-builtins
# (the last one alone drags in the whole wasm-compose chain). `async` and
# `component-model` are forced by wasmtime-wasi's p1 → p2 chain and are
# declared explicitly to document that.
wasmtime = { version = "49", default-features = false, features = [
    "addr2line",
    "anyhow",
    "async",
    "backtrace",
    # KNOWN UPSTREAM BUG (wasmtime 49.x, macOS): the Mach exception handler
    # thread aborts the whole process when mach_msg returns
    # MACH_RCV_INTERRUPTED — any caught signal (SIGCHLD from tokio::process
    # child spawns) delivered to that thread triggers it. This is the flaky
    # `cargo test -p tack-app --lib` SIGABRT on macOS. Fixed upstream by
    # PR #14414 (issue #14393); the fix missed 49.0.2 (still on
    # MACH_RCV_INTERRUPT there), so bump to 50.0.0 as soon as it ships.
    # Store call hooks, used to replenish the guest's fuel budget on every
    # guest→host call (no transitive dependencies).
    "call-hook",
    "component-model",
    "cranelift",
    "demangle",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }
wasmtime-wasi = { version = "49", features = ["p1"] }

[dev-dependencies]
# Temp directories for preopen-grant tests (host side of the fs fixtures).
tempfile.workspace = true

[lints]
workspace = true

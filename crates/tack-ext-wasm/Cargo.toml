[package]
name = "tack-ext-wasm"
description = "Tack extension host: sandboxed WASM (wasmtime / WASI p1) carrier for the tack-ext NDJSON plugin protocol"
version.workspace = true
edition.workspace = true
# wasmtime 50 declares rust-version 1.97 — that is this crate's real floor.
rust-version = "1.97"
license.workspace = true
repository.workspace = true

[dependencies]
tack-ext.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
# Trimmed feature set: tack-ext-wasm runs WASI p1 core modules with fuel and
# epoch interruption only. Dropped from wasmtime defaults: the gc/*
# proposals, threads, stack-switching, pooling-allocator, coredump,
# profiling, debug/debug-builtins, wit-parser and compile-time-builtins
# (the last one alone drags in the whole wasm-compose chain). `async` and
# `component-model` are forced by wasmtime-wasi's p1 → p2 chain and are
# declared explicitly to document that.
wasmtime = { version = "50.0.1", default-features = false, features = [
    "addr2line",
    "anyhow",
    "async",
    "backtrace",
    # >=50.0.1 is required, not cosmetic: wasmtime <=49.x has a macOS bug
    # where the Mach exception handler thread aborts the whole process when
    # mach_msg returns MACH_RCV_INTERRUPTED — any caught signal (e.g. SIGCHLD
    # from tokio::process child spawns) delivered to that thread triggers it.
    # That was the flaky `cargo test -p tack-app --lib` SIGABRT on macOS.
    # Fixed upstream by PR #14414 (issue #14393) in the 50 series; pin
    # 50.0.1 for its accompanying security fixes.
    "component-model",
    "cranelift",
    "demangle",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }
wasmtime-wasi = { version = "50.0.1", features = ["p1"] }
# `GuestMemory`/ABI helpers behind wasmtime-wasi's p1 functions: the
# budget-rearming wrappers for fd_read/fd_write reconstruct the (small)
# generated linker wrapper, so they need the same type wasmtime-wasi's
# p1 trait signatures use.
wiggle = { version = "50.0.1", default-features = false, features = ["wasmtime"] }

[dev-dependencies]
# Temp directories for preopen-grant tests (host side of the fs fixtures).
tempfile.workspace = true

[lints]
workspace = true
